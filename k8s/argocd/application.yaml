apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-bad
  namespace: argocd
spec:
  project: aidlc-demo
  source:
    repoURL: https://github.com/anooptejt/demo-bad.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-bad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
